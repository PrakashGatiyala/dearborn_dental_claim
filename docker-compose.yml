services:
  postgres:
    image: postgres:16-alpine
    container_name: dental_postgres
    environment:
      POSTGRES_DB: dental_claims
      POSTGRES_USER: dental
      POSTGRES_PASSWORD: dental123
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dental -d dental_claims"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dental_net

  backend:
    build: ./backend
    container_name: dental_backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dental:dental123@postgres:5432/dental_claims
      # Set these in .env (see .env.example) — never commit real keys here.
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-gpt-4o}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-12-01-preview}
    env_file:
      - path: .env
        required: false
    volumes:
      - ./backend:/app
    networks:
      - dental_net
    restart: on-failure

  frontend:
    image: node:20-alpine
    container_name: dental_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    networks:
      - dental_net

volumes:
  pgdata:

networks:
  dental_net:
    driver: bridge
